# On every push to master: SSH into the Oracle box and redeploy.
# The deploy key is restricted server-side to ~/bin/actual-deploy, which
# syncs ~/actual to origin/master and runs deploy/oracle/deploy.sh.
# Secrets: DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS, DEPLOY_USER, DEPLOY_HOST.

name: Deploy to Oracle

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-oracle
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'jackjustus/actual'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Build and swap container
        run: |
          ssh -o ServerAliveInterval=30 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" deploy
